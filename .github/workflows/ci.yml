name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, taskPI-frontend]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: neoguardian_test
          POSTGRES_USER: neoguardian
          POSTGRES_PASSWORD: neoguardian-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neoguardian -d neoguardian_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: development
      APP_SECRET_KEY: ci-only-secret-key-with-more-than-32-characters
      DATABASE_URL: postgresql+asyncpg://neoguardian:neoguardian-ci-only@localhost:5432/neoguardian_test
      BOOTSTRAP_ADMIN_NAME: Administrador CI
      BOOTSTRAP_ADMIN_EMAIL: admin@neoguardian.com
      BOOTSTRAP_ADMIN_PASSWORD: ci-only-strong-password-2026!
      BOOTSTRAP_CLIENT_NAME: Ambiente CI
      BOOTSTRAP_CLIENT_SLUG: ci
      RUN_DATABASE_TESTS: "1"
      AI_PROVIDER: disabled
      TICKET_PROVIDER: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API dependencies
        run: python -m pip install -e "apps/api[dev]"
      - name: Apply database migrations
        env:
          PGPASSWORD: neoguardian-ci-only
        run: |
          for migration in database/migrations/*.sql; do
            psql -h localhost -U neoguardian -d neoguardian_test -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Lint API
        run: ruff check apps/api
      - name: Test API and database flow
        run: pytest apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Lint web
        run: npm run lint
      - name: Test local setup and diagnostics
        run: npm test
      - name: Build web
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start isolated database and API (no AI credentials)
        run: npm run test:e2e:up
      - name: Test browser workflows
        run: npm run test:e2e
      - name: Show isolated service logs on failure
        if: failure()
        run: docker compose -p wvm-pi-e2e -f compose.e2e.yml logs --tail=100
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Stop isolated services
        if: always()
        run: npm run test:e2e:stop

  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test backup guards without Docker
        run: npm run test:backup
      - name: Restore a synthetic database in isolated Docker containers
        env:
          RUN_BACKUP_INTEGRATION: "1"
        run: npm run test:backup:integration
