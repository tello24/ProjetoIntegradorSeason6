services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neoguardian}
      POSTGRES_USER: ${POSTGRES_USER:-neoguardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neoguardian-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro

  migrations:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-neoguardian-local-only}
    command:
      - sh
      - -c
      - >-
        psql -h database -U ${POSTGRES_USER:-neoguardian}
        -d ${POSTGRES_DB:-neoguardian} -v ON_ERROR_STOP=1
        -f /migrations/005_ai_analysis.sql &&
        psql -h database -U ${POSTGRES_USER:-neoguardian}
        -d ${POSTGRES_DB:-neoguardian} -v ON_ERROR_STOP=1
        -f /migrations/006_ticket_integration.sql &&
        psql -h database -U ${POSTGRES_USER:-neoguardian}
        -d ${POSTGRES_DB:-neoguardian} -v ON_ERROR_STOP=1
        -f /migrations/007_access_control.sql &&
        psql -h database -U ${POSTGRES_USER:-neoguardian}
        -d ${POSTGRES_DB:-neoguardian} -v ON_ERROR_STOP=1
        -f /migrations/008_asset_intelligence.sql &&
        psql -h database -U ${POSTGRES_USER:-neoguardian}
        -d ${POSTGRES_DB:-neoguardian} -v ON_ERROR_STOP=1
        -f /migrations/009_asset_business_context.sql
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./database/migrations:/migrations:ro

  api:
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://neoguardian:neoguardian-local-only@database:5432/neoguardian}
    depends_on:
      database:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:8000/api/v1}
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/workspace/apps/web
      - web_node_modules:/workspace/node_modules
      - web_next:/workspace/apps/web/.next

volumes:
  postgres_data:
  web_node_modules:
  web_next:
