[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neoguardian-insight-api"
version = "0.1.0"
description = "API interna do WVM — Wolf Vulnerability Management"
requires-python = ">=3.13"
dependencies = [
  "asyncpg>=0.30,<1",
  "defusedxml>=0.7.1,<1",
  "email-validator>=2.3,<3",
  "fastapi==0.141.1",
  "pwdlib[argon2]==0.3.1",
  "PyJWT==2.13.0",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
